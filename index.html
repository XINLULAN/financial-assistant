*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg-main);color:var(--text-main);font-size:15px;line-height:1.6;height:100vh;display:flex;flex-direction:column;overflow:hidden}

.chat-area{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:16px 12px 8px;scroll-behavior:smooth;min-height:0;-webkit-overflow-scrolling:touch}
.msg-wrap{margin-bottom:16px;display:flex;flex-direction:column}

.msg-bubble p{margin-bottom:6px}.msg-bubble p:last-child{margin-bottom:0}
.msg-bubble ul,.msg-bubble ol{padding-left:18px;margin-bottom:6px}

const DOC_CONTEXT = `【公司组织架构】员工 → 经理 → 副总经理 → 中心总经理/总裁特别助理 → 副总裁 → 总裁

【财务支出管理制度 —— 全文】

第一章 总则
第一条 目的：为规范公司各项财务支出行为，建立"事前预算管控+事中流程审批+事后监管核查"的全链路财务管控体系。
第二条 适用范围：公司全体员工（含高管、试用期员工、劳务派遣人员）。
第三条 基本原则：真实性、相关性、合理性、合规性、及时性、分类管控、预算先行与事后监管并重。
第四条 支出管控分类：重大活动/专项支出（>2万元）→事前预算+事后决算；资本性支出（≥2000元且>1年）→预算+审批+资产登记；大额采购（≥2万元）→比价+合同管控；对外投资/资金拆借→专项审批+风控评估；日常费用（差旅/招待/办公等）→标准管控+强事后监管，不要求前置预算。
第五条 业务部门费用标准备案：各部门费用标准、合同协议须在费用发生前提交财务备案。
第六条 票据不合规处理：发票信息有误退回重开；品目不符退回重开；无法查验真伪不予报销。
第七条 支付流程（7步）：经办人发起→上级领导业务审核→中心负责人管理审核→财务审核→总裁裁量终审→出纳付款→凭证归档。特殊规则：若经办人即上级领导，第2、3步合并。

第二章 预算管理
第八条 预算管理范围：仅适用于专项活动、资本性支出、大额采购（≥2万）、对外投资四类。
第九条 临时专项预算：活动前至少30天提交（策划方案+预算表+责任人分工），财务初审(3工作日)→总裁审批。
第十条 无预算不支出。

第三章 费用报销管理
11.1 可报销费用及附件：差旅费（发票+行程单+出差审批单+住宿清单+付款凭证）、招待费（发票+招待清单+事前审批单+小票+付款凭证）、办公费（发票+购物清单+付款凭证）、会议费（发票+通知+签到表+付款凭证）、交通费（发票+审批单+维修清单+付款凭证）、通讯费（发票+付款凭证）、培训费（发票+通知/签到表+付款凭证）、技术服务费（发票+合同+付款凭证+交付说明）、咨询服务费（发票+合同+付款凭证+交付说明）、其他（发票+审批材料+付款凭证）。
11.2 不可报销费用红线：个人消费、家庭开支、个人手机、个人送礼、违章罚款、个人快递、高尔夫/SPA/高档KTV、虚假票据、超标部分。
11.3 支付方式划分：A类（≤1000元）个人垫付，单月累计≤5000；B类（1000-5000元）备用金借款转账；C类（>5000元）必须对公账户付款，严禁个人垫付。
11.4 差旅费标准：
- 交通工具：总裁（全可）、副总裁/中心总经理（飞机√，高铁二等√，软席需特批）、其他人员（飞机需特批，高铁二等√，硬席√）。
- 住宿费（元/间/天）：一线城市北上广深（总裁500/副总裁400/中心总经理300/总经理以下250），二线城市省会直辖市（总裁400/副总裁250/中心总经理200/总经理以下150），其他城市（总裁300/副总裁250/中心总经理200/总经理以下150）。
- 出差补贴：80元/天（天数>1天，按自然天数计算，无需发票）。工作简餐：30元/人/餐（当日往返、不产生住宿的公务出行）。
- 出差天数计算：启程12:00前算一天/后算半天，返程12:00前算半天/后算一天。
- 同性二人出差按一间房报销，副总以上可单独住宿。有接待单位或住亲友家不予报销住宿费。
- 出差钉钉提交《出差申请》，审批后行政中心统一购买机票火车票。
- 出差期间宴请客户或被宴请扣除出差补贴（早餐20%/午餐40%/晚餐40%）。
11.5 业务招待费标准：战略合作伙伴/政府/投资人/行业专家→200元/人/餐；一般商务洽谈/潜在合作方→100元/人/餐。先申报后招待，客户住宿交通由行政中心统一安排。
第十二条 员工借款：借款审批单→领款→当月报账→前款未清后款不借→备用金余额≤5000元→逾期从工资扣回。
第十三条 公司车辆管理：中心副总经理及以上可申请用车；市区无车时公共交通/同行2人可网约车；加班至23:00后可网约车凭发票报销；私车公用补贴1元/公里（中心副总经理及以上）；维修>1000元须总裁审批。
第十四条 跨主体费用处理：费用按实际归属主体报销，跨主体分摊须有书面协议。
第十五条 其他费用标准：办公用品/设备<1000元统一采购，设备≥1000元须部门负责人审批。
第十六条 发票要求：抬头为公司全称，税号为统一社会信用代码，品目与实际业务一致，增值税普通发票。
第十七条 付款方式：银行转账至工资卡，每周五集中付款。
第十八条 报销时限：差旅费返程后30天内，日常费用发生后30天内，逾期须总裁特批。

第四章 事后监管
第十九至二十四条：日常费用不设预算但强监管。财务交叉校验4项（日期闭合/金额合理/人票一致/科目匹配）。月度差异预警+年度费用审计。追回机制：不合规费用10个工作日内退回，逾期从工资扣。

第五章 工资薪金福利
第二十五条：人事每月8日前提报考勤绩效→社保公积金15日前提交→财务25日前扣缴。食堂采购行政中心配合，宿舍租金行政中心统一报销。

第六章 采购支出管理
第二十六至二十八条：供应商须提供执照/许可/税务登记；首次合作核查工商/纳税/失信。单笔≥5000元签书面合同。采购人以外人员验收签单，合同金额/发票金额/验收金额三者一致。预付款不超过30%。

第七章 重大活动与专项支出
第二十九至三十三条：预算≥2万或≥50人或涉及外部人员属重大活动。前30天提交方案+预算。事中单笔≥2万提交确认单，达预算80%预警。事后15天内决算，差异>±20%书面说明。

第八章 资本性支出管理
第三十四至三十七条：单价≥2000元且>1年。须年度预算。行政部统一编号建卡贴标签。每年12月盘点，直线法折旧。报废/出售须部门+行政+财务+总裁审批。

第九章 对外投资与资金拆借
第三十八至四十条：股权投资须总裁审批+四份材料。>净资产10%须董事会决议。严禁个人名义代收付资金/账户过桥/抽逃出资。投后按季度跟踪。

第十章 附则
第四十一条：试行期3个月，同步取消2025年第11号制度。

【合同管理制度 —— 全文】
一、总则：依据民法典制定，适用于公司所有书面合同、协议、意向书、备忘录。
二、管理职责：业务/经办部门为第一责任部门（资信调查/谈判起草/履行跟进），财务部门审核付款/结算/税务/价格条款。
三、合同审批流程：业务经办人→总裁特别助理→财务经理→总裁办。钉钉发起《合同审批》，各环节1-3工作日完成。优先使用公司标准合同文本。
四、合同签署盖章：最终审批人批准后方可签署。须使用公章或合同专用章。盖章前核对审批流程完整性。至少我方一份+对方一份。
五、合同履行变更解除：业务部门跟踪进度/质量/付款节点。变更须签书面补充协议，审批流程同原合同。不得以口头/邮件替代。
六、合同归档保管：签署后7个工作日内移交行政中心统一归档。电子扫描件同步备份。
七、责任追究：未经授权/未经审核签合同、与对方串通、玩忽职守造成损失，追究行政/经济/刑事责任。`;

    <div style="font-size:48px;margin-bottom:12px">💰</div>
    <h2>财务智能助手</h2>
    <p>基于 DeepSeek AI · 精准解答制度问题<br>月费约 ¥1-2</p>
    <input type="password" id="apiKeyInput" placeholder="粘贴 DeepSeek API Key (sk-xxx)" autocomplete="off">
    <button onclick="saveKey()">开始使用</button>
    <a href="https://platform.deepseek.com/api_keys" target="_blank">去 DeepSeek 获取 API Key →</a>
    <div class="error-badge" id="apiError"></div>
  </div>`;
  document.getElementById('apiKeyInput')?.addEventListener('keydown',e=>{if(e.key==='Enter')saveKey();});
}

function saveKey() {
  const val = document.getElementById('apiKeyInput').value.trim();
  if (!val || !val.startsWith('sk-')) {
    const err = document.getElementById('apiError');
    if (err) { err.style.display='block'; err.textContent='API Key 格式错误，应以 sk- 开头'; }
    return;
  }
  API_KEY = val;
  try { localStorage.setItem('ds_api_key', val); } catch(e) {}
  showChat();
}

function showChat() {
  chatArea.innerHTML = `<div class="header">
    <div class="header-avatar">💰</div>
    <div class="header-info"><div class="header-title">财务智能助手</div><div class="header-sub">DeepSeek AI · 精准回答</div></div>
    <div class="header-share" onclick="openShare()" title="分享给同事">🔗</div>
  </div>
  <div class="chat-area" id="chatList"></div>
  <div class="input-area">
    <div class="input-wrap"><textarea id="inputBox" rows="1" placeholder="输入问题... 如：加班到几点能打车报销？"></textarea></div>
    <button class="send-btn" id="sendBtn" onclick="sendMsg()">➤</button>
  </div>`;

  const cl = document.getElementById('chatList');
  // 欢迎语
  cl.innerHTML = `<div class="msg-wrap bot"><div class="msg-bubble"><p>👋 您好！我是基于 DeepSeek 的财务智能助手。</p><p>我已完整学习了公司《财务支出管理制度》和《合同管理制度》，您可以像跟同事聊天一样问我任何问题，例如：</p><ul><li>"加班到几点打车公司报销"</li><li>"副总裁去北京出差住宿费标准"</li><li>"合同审批流程是什么"</li></ul></div><div class="msg-time">${getTime()}</div></div>`;

  const ib = document.getElementById('inputBox');
  ib.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'});
  ib.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});
}

// ============================================================
//  分享给同事 —— 链接携带共享密钥，同事打开即用
// ============================================================
function openShare() {
  if (!API_KEY) { alert('请先填写您的 API Key'); return; }
  const mask = document.getElementById('shareMask');
  mask.style.display = 'flex';
  const link = buildShareLink();
  document.getElementById('shareLink').textContent = link;
  renderQR(link);
}
function closeShare() { document.getElementById('shareMask').style.display = 'none'; }
function buildShareLink() {
  if (!API_KEY) return location.origin + location.pathname;
  // 把密钥做 URL 安全的 base64 编码后拼到链接
  const enc = encodeURIComponent(btoa(unescape(encodeURIComponent(API_KEY))));
  return location.origin + location.pathname + '?k=' + enc;
}
function copyShare() {
  const link = document.getElementById('shareLink').textContent;
  const done = () => { const t=document.getElementById('shareToast'); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(link).then(done).catch(()=>{ fallbackCopy(link); done(); });
  } else { fallbackCopy(link); done(); }
}
function fallbackCopy(text) {
  const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta);
}
function renderQR(text) {
  const box = document.getElementById('qrBox');
  box.innerHTML = '';
  if (window.QRCode) { new QRCode(box, {text:text,width:170,height:170,colorDark:'#2A5F8A',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}); return; }
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@master/qrcode.min.js';
  s.onload=()=>{ box.innerHTML=''; new QRCode(box,{text:text,width:170,height:170,colorDark:'#2A5F8A',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}); };
  s.onerror=()=>{ box.innerHTML='<span style="font-size:12px;color:#9BA8B8">二维码加载失败<br>请直接复制下方链接</span>'; };
  document.head.appendChild(s);
}

function addMsg(type,text) {
  const cl = document.getElementById('chatList');
  if (!cl) return;
  const wrap = document.createElement('div');
  wrap.className='msg-wrap '+type;
  const bub = document.createElement('div');
  bub.className='msg-bubble';
  bub.innerHTML = text;
  const tm = document.createElement('div');
  tm.className='msg-time';tm.textContent=getTime();
  wrap.appendChild(bub);wrap.appendChild(tm);
  cl.appendChild(wrap);
  scrollBottom();
  return bub;
}

function addTyping() {
  const cl = document.getElementById('chatList');
  if (!cl) return;
  const wrap = document.createElement('div');wrap.className='msg-wrap bot';wrap.id='typing';
  const bub = document.createElement('div');bub.className='msg-bubble';
  bub.innerHTML='<div class="typing-dots"><span></span><span></span><span></span></div>';
  wrap.appendChild(bub);cl.appendChild(wrap);
  scrollBottom();
}
function rmTyping() { const t=document.getElementById('typing');if(t)t.remove(); }

async function sendMsg() {
  const ib = document.getElementById('inputBox');
  const btn = document.getElementById('sendBtn');
  if (!ib || !API_KEY) return;
  const q = ib.value.trim();
  if (!q) return;
  addMsg('user', `<p>${escapeHtml(q)}</p>`);
  ib.value='';ib.style.height='auto';
  addTyping();
  btn.disabled = true;

  try {
    const msgs = [
      { role: 'system', content: `你是公司财务制度智能助手。你必须严格根据以下制度文档来回答问题，不得编造文档中没有的信息。

【制度文档】
${DOC_CONTEXT}

【回答规则】
1. 必须只基于上述文档内容回答，不得编造
2. 如果文档中有明确规定，直接引用具体条文和数字
3. 如果问题涉及职级差异（如住宿标准），请按员工职级分类说明
4. 如果文档中没有相关信息，如实告知"制度中无此规定"
5. 回答简洁有条理，使用编号或表格时用纯文本格式
6. 始终用中文回答` },
      ...conversationHistory,
      { role: 'user', content: q }
    ];

    const resp = await fetch('https://api.deepseek.com/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + API_KEY },
      body: JSON.stringify({ model: 'deepseek-chat', messages: msgs, temperature: 0.3, max_tokens: 1500 })
    });

    rmTyping();

    if (!resp.ok) {
      const errText = await resp.text().catch(() => '');
      let errMsg = `API 请求失败 (${resp.status})`;
      if (resp.status === 401) {
        errMsg = 'API Key 无效或已过期，请重新设置';
        clearStoredKey();
        setTimeout(showSetup, 1500);
      }
      else if (resp.status === 402) errMsg = 'DeepSeek 账户余额不足，请充值';
      else if (resp.status === 429) errMsg = '请求太频繁，请稍后再试';
      addMsg('bot', `<p>⚠️ ${escapeHtml(errMsg)}</p>` + (errText ? `<p style="font-size:11px;color:var(--text-light)">${escapeHtml(errText.substring(0,200))}</p>` : ''));
      btn.disabled = false;
      return;
    }

    const data = await resp.json();
    const answer = data.choices?.[0]?.message?.content || '抱歉，没有获取到回答。';
    const formatted = formatAnswer(answer);

    conversationHistory.push({ role: 'user', content: q });
    conversationHistory.push({ role: 'assistant', content: answer });
    // 保持最近10轮对话
    if (conversationHistory.length > 20) conversationHistory = conversationHistory.slice(-20);

    addMsg('bot', formatted + '<div class="source-ref">🤖 DeepSeek AI 回答 · 基于制度文档</div>');
  } catch (e) {
    rmTyping();
    addMsg('bot', `<p>⚠️ 网络错误：${escapeHtml(e.message)}</p><p style="font-size:12px;color:var(--text-light)">请检查网络连接后重试</p>`);
  }
  btn.disabled = false;
}

function formatAnswer(text) {
  // 简单的 Markdown 转 HTML
  let html = text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n### (.*)/g, '\n<h4>$1</h4>')
    .replace(/\n## (.*)/g, '\n<h4>$1</h4>')
    .replace(/\n# (.*)/g, '\n<h4>$1</h4>')
    .replace(/\n- /g, '\n<li>')
    .replace(/\n(\d+)\. /g, '\n<li>');
  
  // Wrap lists
  html = html.replace(/((?:<li>.*?\n?)+)/g, '<ul>$1</ul>');
  html = html.replace(/\n/g, '<br>');
  html = html.replace(/<ul><br>/g, '<ul>');
  
  return `<div style="white-space:normal">${html}</div>`;
}

// 初始化 — 优先级：URL 携带密钥 > 本地存储 > 输入设置
function clearStoredKey() {
  try { localStorage.removeItem('ds_api_key'); } catch(e) {}
  API_KEY = '';
  conversationHistory = [];
}
const savedKey = (() => { try { return localStorage.getItem('ds_api_key'); } catch(e) { return null; } })();
// 如果本地存的是已吊销的旧 Key（尾号 daab）或任何非 sk- 开头的值，自动清理
const isOldRevokedKey = savedKey && savedKey.endsWith('daab');

function getUrlKey() {
  try {
    const p = new URLSearchParams(location.search).get('k');
    if (!p) return null;
    const dec = decodeURIComponent(escape(window.atob(decodeURIComponent(p))));
    return dec.startsWith('sk-') ? dec : null;
  } catch(e) { return null; }
}
const urlKey = getUrlKey();
if (urlKey) {
  API_KEY = urlKey;
  try { localStorage.setItem('ds_api_key', urlKey); } catch(e) {}
  try { history.replaceState(null, '', location.pathname); } catch(e) {}
  showChat();
} else if (savedKey && savedKey.startsWith('sk-') && !isOldRevokedKey) {
  API_KEY = savedKey;
  showChat();
} else {
  if (isOldRevokedKey) clearStoredKey();
  showSetup();
}
</script>
</body>
</html>
